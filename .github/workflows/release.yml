name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm HouseholdManager.spec

      - name: Prepare Windows Asset
        if: matrix.os == 'windows-latest'
        run: mv dist/HouseholdManager.exe ./HouseholdManager-Windows.exe

      - name: Prepare macOS Asset
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r ../HouseholdManager-macOS.zip HouseholdManager.app

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            HouseholdManager-Windows.exe
            HouseholdManager-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
